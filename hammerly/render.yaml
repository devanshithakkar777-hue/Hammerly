services:
  - type: web
    name: hammerly
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: hammerly-db, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false          # set to your email in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # optional
      - key: SEED_DEMO
        value: "true"        # set to false once you have real data
      - key: CORS_ORIGINS
        value: "*"
databases:
  - name: hammerly-db
    plan: free
